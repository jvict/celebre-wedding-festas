services:
  db:
    image: postgres:16-alpine
    container_name: celebre-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: celebre
      POSTGRES_PASSWORD: celebre
      POSTGRES_DB: celebre
    ports:
      - '5432:5432'
    volumes:
      - celebre-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U celebre -d celebre']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  celebre-db-data:
